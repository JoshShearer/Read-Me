AutoUpdateMode: Version
UpdateCheckMode: Tags
# versionCode is 10 x build.gradle's + the ABI's index (android/app/build.gradle, REA-40).
VercodeOperation:
  - 10 * %c + 1
  - 10 * %c + 2
  - 10 * %c + 3
  - 10 * %c + 4
