                  - heading [level=2] [ref=e409]:
                    - text: Notes
                    - link "Link to heading 'Notes'" [ref=e410] [cursor=pointer]:
                      - /url: "#notes"
                  - list [ref=e411]:
                    - listitem [ref=e412]: "Reproducible build: each ABI's APK in the GitHub release (v1.0.4) is signed with the key in AllowedAPKSigningKeys. Before the release, this recipe was run through fdroiddata's own build job in registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie, and each ABI's output matched our APK apart from the signature."
                    - listitem [ref=e413]:
                      - text: hermesc is built from source from the Hermes submodule (pinned at tag hermes-v250829098.0.17), outside the source tree, and the prebuilt one is scandeleted. Hermes's own Android library (
                      - code [ref=e414]: external/hermes/android
                      - text: ", whose Maven publishing script the scanner flags) is scandeleted; hermesc does not use it, and prebuild has already built hermesc by then."
                    - listitem [ref=e415]: Node.js and npm come from Debian forky (24.21.0); trixie's 20.19 is below React Native's ^22.13 || ^24.3. R8 is on since 1.0.4.
                    - listitem [ref=e416]:
                      - text: The app uses React Native's released
                      - code [ref=e417]: react-android
                      - text: and
                      - code [ref=e418]: hermes-android
                      - text: AARs from Maven Central.
                    - listitem [ref=e419]:
                      - text: prebuild runs at the repo root (fdroidserver joins the entries into one shell after the cd). gradle.properties has no final newline, hence the leading \n. The appended
                      - code [ref=e420]: reactNativeArchitectures
                      - text: selects the ABI for both React Native's native build and the ABI split.
                    - listitem [ref=e421]: "scandelete: node_modules/fb-dotslash/bin (the dotslash launcher) and react-native/React/I18n/strings (iOS-only) are not used by the Android build."
                    - listitem [ref=e422]: "scanignore: ReactAndroid/publish.gradle is React Native's own publishing config (the app uses the released AARs). safe-area-context's build.gradle references a local directory repo, not a remote one."
                    - listitem [ref=e423]:
                      - text: "Reports tab:"
                      - list [ref=e424]:
                        - listitem [ref=e425]: "\"Cleartext Traffic Permitted\" (major): intentional. The app accepts shared http:// links as well as https:// ones and fetches the page the user shared; a single fetcher class is the only network call site, and it runs only on a share or an explicit Retry."
                        - listitem [ref=e426]: "INTERNET (minor): used only for that fetch. No analytics, crash reporting or update checks."
                        - listitem [ref=e427]: "RECEIVE_BOOT_COMPLETED (info): from AndroidX WorkManager, which runs the fetch; it reschedules pending work after a reboot."
