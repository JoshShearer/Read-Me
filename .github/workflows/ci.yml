name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:scripts
      - run: node scripts/check-licenses.mjs

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Android SDK packages
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null
          "$SM" "platforms;android-37.0" "build-tools;37.0.0" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Kotlin unit tests and release build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Licenses asset matches the dependencies (R-M13)
        run: node scripts/make-notices.mjs --check
      - name: No non-free dependencies in the resolved tree
        working-directory: android
        run: |
          ./gradlew --no-daemon --quiet :app:dependencies --configuration releaseRuntimeClasspath > deps.txt
          if grep -iE "com\.google\.android\.gms|firebase|crashlytics|play-services|com\.google\.android\.play" deps.txt; then
            echo "non-free dependency in the release runtime classpath"; exit 1
          fi
